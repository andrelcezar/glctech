<!--
  Standard visual shell for every glctechsec-audit report (weekly and
  monthly), adopted 2026-08-15 after the user approved the styled HTML
  version sent that day (messageId 1786815090373138400) as the standard
  going forward. Do not redesign this per run — reuse it as-is.

  How to use this file (see SKILL.md step 6):
  1. Copy this whole file.
  2. Replace {{TITLE}}, {{PERIOD}}, {{MODE_LABEL}} in the header.
  3. Replace {{BODY}} with the report's own sections, built from the
     component patterns below (h2 for section titles, table for Status
     geral/Recomendações, .badge for severity, .finding + <pre> for the
     full §21 finding blocks, .note for caveats/technical notes, ul/ol for
     lists) — mirror exactly what audit-agent/history/runs/2026-08-15-report.html
     already did; that file is the reference example.
  4. Replace {{FOOTER_NOTE}} with anything run-specific (e.g. link to the
     PR/commit, if relevant).
  5. This same file (content unescaped) is what goes in ZohoMail_sendEmail's
     body.content, mailFormat "html" — send the whole document, not a
     fragment.
-->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f4f4f6; color:#1f1f24; margin:0; padding:0; }
  .wrap { max-width: 760px; margin: 0 auto; background:#ffffff; }
  .header { background:#2d2d2d; color:#fff; padding:32px 40px; }
  .header .label { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#e6262c; font-weight:700; margin:0 0 8px; }
  .header h1 { margin:0; font-size:22px; line-height:1.3; }
  .header .meta { margin-top:10px; font-size:13px; color:#c9c9c9; }
  .content { padding: 32px 40px 48px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:#e6262c; border-bottom:2px solid #eee; padding-bottom:8px; margin:32px 0 14px; }
  h2:first-of-type { margin-top:0; }
  h3 { font-size:14px; color:#2d2d2d; margin:20px 0 8px; }
  p { line-height:1.6; font-size:14px; }
  table { width:100%; border-collapse: collapse; font-size:13px; margin: 8px 0 16px; }
  th, td { border:1px solid #e2e2e6; padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:#f7f7f9; font-weight:700; }
  .badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; font-weight:700; text-transform:uppercase; }
  .sev-alto { background:#fde8e8; color:#b3261e; }
  .sev-medio { background:#fff3cd; color:#8a6100; }
  .sev-baixo { background:#e7f4e8; color:#1f7a2e; }
  .finding { background:#fafafa; border:1px solid #eee; border-left:4px solid #e6262c; border-radius:4px; padding:14px 16px; margin:10px 0 20px; font-size:13px; }
  .finding pre { white-space:pre-wrap; font-family: inherit; margin:0; line-height:1.7; }
  .note { font-size:12px; color:#777; background:#f7f7f9; border-radius:4px; padding:10px 14px; margin-top:8px; }
  .footer { padding:20px 40px; font-size:11px; color:#999; border-top:1px solid #eee; }
  ul, ol { font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <p class="label">GLCTechSec Europe · Agente de Auditoria Contínua</p>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{PERIOD}} · glctechsec.com · {{MODE_LABEL}}</p>
  </div>

  <div class="content">
    {{BODY}}
  </div>

  <div class="footer">
    Gerado automaticamente pelo Agente de Auditoria Contínua GLCTechSec (skill <code>glctechsec-audit</code>).
    Enviado de <strong>contact@glctechsec.com</strong>. {{FOOTER_NOTE}}
  </div>
</div>
</body>
</html>
